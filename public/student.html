<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chemistry Race — Player</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap');
*{box-sizing:border-box}body{margin:0;font-family:Rajdhani,Arial,sans-serif;background:radial-gradient(circle at 15% 5%,#dff8ff,#fff8d8 40%,#eeeaff 78%,#fff);color:#17324d;min-height:100vh;overflow-x:hidden}.wrap{max-width:760px;margin:auto;padding:14px}.card{background:linear-gradient(145deg,#ffffffef,#f4fbffed);border:1px solid #72d8ff;border-radius:24px;padding:18px;box-shadow:0 12px 40px #1674a51a;margin:12px 0;position:relative;overflow:hidden}.card:before{content:"";position:absolute;inset:-2px;background:linear-gradient(90deg,#00c8ff55,#8d63ff33,#ffc93d44);opacity:.35;pointer-events:none}.top,.stats,.racehead{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative}.logo{letter-spacing:3px;color:#087fc1;font-weight:700;font-size:30px}.muted{color:#55748c}.hide{display:none}.score{font-size:22px;font-weight:700;color:#b86f00}.timer{font-size:52px;font-weight:700;color:#f29b00;text-shadow:0 0 18px #ffbf5544;min-width:82px;text-align:center}.question{font-size:28px;font-weight:700;line-height:1.22;margin:16px 0}.option{width:100%;margin:7px 0;padding:17px;border-radius:17px;border:1px solid #78cfe9;background:linear-gradient(135deg,#ecfaff,#f5f0ff);color:#17324d;text-align:left;font:600 18px Rajdhani;cursor:pointer;transition:.15s;position:relative;overflow:hidden}.option:hover{transform:translateY(-2px);box-shadow:0 8px 20px #00b7ff22}.option:active{transform:scale(.98)}.option:disabled{opacity:.58}.option.correct{background:linear-gradient(90deg,#c9ffe8,#e9fff8);border-color:#20bd88}.option.wrong{background:linear-gradient(90deg,#ffe0e8,#fff);border-color:#e55370}.btn{width:100%;padding:16px;border:0;border-radius:16px;background:linear-gradient(90deg,#00a9ff,#6c5cff);color:white;font:700 19px Rajdhani;cursor:pointer;box-shadow:0 8px 20px #4b72e833}input{width:100%;padding:15px;border-radius:14px;border:1px solid #5fb7d9;background:#fff;color:#17324d;font-size:17px}.msg{margin-top:12px;padding:12px;border-radius:13px;background:#e8f8ff;color:#0b6c96}.atom{font-size:65px;text-align:center;animation:spin 5s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.pulse{animation:pulse .55s}@keyframes pulse{50%{transform:scale(1.04);filter:brightness(1.18)}}.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bg-orbs{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:-1}.orb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.35;animation:float 10s ease-in-out infinite}.orb:nth-child(1){width:130px;height:130px;left:5%;top:12%;background:#6fe4ff}.orb:nth-child(2){width:180px;height:180px;right:8%;top:35%;background:#ffd76a;animation-delay:2s}.orb:nth-child(3){width:100px;height:100px;left:45%;bottom:4%;background:#a98cff;animation-delay:4s}@keyframes float{50%{transform:translate(20px,-25px) scale(1.12)}}.progress{height:10px;background:#dcecf4;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#1cc8ff,#7c63ff,#ffbf3c);transition:width .25s}.badge{padding:7px 11px;border-radius:999px;background:#eef5ff;color:#536b8b;font-weight:700}.streak{color:#ef7b00;font-weight:700}.rankbox{font-size:20px;font-weight:700}.rankbox b{color:#6c5cff}.level{font-size:14px}.particles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}.particle{position:absolute;font-size:22px;animation:pop 900ms ease-out forwards}@keyframes pop{0%{transform:translate(0,0) scale(.4);opacity:0}20%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(260deg) scale(1.2);opacity:0}}
#countdown{position:fixed;inset:0;background:#ffffffd9;backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:30;font-size:110px;font-weight:700;color:#6c5cff;text-shadow:0 10px 30px #6c5cff44;pointer-events:none;opacity:0;transition:.15s}#countdown.show{opacity:1}.finish{font-size:30px;text-align:center;font-weight:700}.finish .big{font-size:72px}
</style></head><body><div class="bg-orbs"><i class="orb"></i><i class="orb"></i><i class="orb"></i></div><div id="particles" class="particles"></div><div id="countdown"></div><div class="wrap">
<div id="join" class="card"><div class="atom">⚛️</div><div class="logo">CHEMISTRY RACE</div><p class="muted">Bu oddiy test emas — tezlik, bilim va combo poygasi! 🏁</p><div class="badge" id="joinStatus">🌐 O‘yin havolasi orqali ulanish</div><br><input id="name" placeholder="Ismingizni kiriting" maxlength="30"><br><br><button class="btn" onclick="join()">🚀 RACE'GA KIRISH</button></div>
<div id="game" class="hide"><div class="card top"><div><b id="hello"></b><div class="muted">SAVOL <span id="qn">—</span> · <span id="level" class="level">LVL 1</span></div></div><div class="score">⚡ <span id="score">0</span> XP</div></div>
<div class="card"><div class="stats"><span class="badge">🏆 O‘rin: <b id="rank">—</b></span><span class="streak">🔥 COMBO <b id="streak">0</b></span><span class="badge">🎯 <b id="accuracy">0</b>%</span></div><br><div class="progress"><i id="bar" style="width:0%"></i></div></div>
<div id="playcard" class="card"><div class="racehead"><div class="timer" id="timer">—</div><div id="state" class="badge">KUTISH</div></div><div class="question" id="question">O‘qituvchi o‘yinni boshlashini kuting...</div><div id="options"></div><div id="feedback"></div></div></div>
</div><script>
let ws,id,deadline=0,answered=false,lastQ=0,lastScore=0,audioCtx=null,tickTimer=null,lastTick=0; const SESSION_KEY="chemistryRaceSession_"+(new URLSearchParams(location.search).get("game")||"public"); let session=localStorage.getItem(SESSION_KEY)||""; const GAME_ID=new URLSearchParams(location.search).get("game")||"";
function sound(type){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=type==='ok'?720:type==='bad'?180:type==='tick'?520:390;o.type='sine';g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.06,audioCtx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.16);o.start();o.stop(audioCtx.currentTime+.18)}catch(e){}}
function connect(){
 ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
 ws.onopen=()=>{const n=$("name").value.trim(); if(n) ws.send(JSON.stringify({type:"join",name:n,gameId:GAME_ID,session}));};
 ws.onmessage=e=>{const m=JSON.parse(e.data);
   if(m.type==='joined'){id=m.data.id;session=m.data.session||session;localStorage.setItem(SESSION_KEY,session);$("hello").textContent=m.data.name;sound('join');}
   else if(m.type==='joinError'){alert(m.data.message);}
   else if(m.type==='state')render(m.data);
 };
 ws.onclose=()=>{setTimeout(()=>{if($("game")&&!$("game").classList.contains('hide'))connect()},1500)};
}
function join(){
 const n=$("name").value.trim(); if(!n)return alert('Ismingizni kiriting.');
 audioCtx=new(window.AudioContext||window.webkitAudioContext)();
 $("join").classList.add('hide');$("game").classList.remove('hide');connect();
}
const $=x=>document.getElementById(x);
function render(d){
 const me=d.players.find(x=>x.id===id);
 if(me){$("score").textContent=me.score;$("rank").textContent=me.rank;$("streak").textContent=me.streak;$("accuracy").textContent=Math.round(me.correct/Math.max(1,me.correct+me.wrong)*100);$("level").textContent='LVL '+(1+Math.floor(me.score/500));if(me.score>lastScore){$("score").classList.add('pulse');setTimeout(()=>$("score").classList.remove('pulse'),600);lastScore=me.score}}
 $("qn").textContent=d.game.questionNo?d.game.questionNo+'/'+d.game.total:'—';$("bar").style.width=d.game.total?((d.game.questionNo/d.game.total)*100)+'%':'0%';
 if(d.game.questionNo!==lastQ&&d.game.question){lastQ=d.game.questionNo;answered=false;showCountdown();}
 if(!d.game.running||!d.game.question){
   $("question").innerHTML=d.game.questionNo>=d.game.total&&d.game.total?'<div class="finish"><div class="big">🏆</div>RACE YAKUNLANDI!</div>':'⏳ Keyingi savol tayyorlanmoqda...';
   $("options").innerHTML='';$("state").textContent=d.game.questionNo>=d.game.total?'FINISH':'KEYINGI SAVOL TAYYORLANMOQDA';$("timer").textContent='—';return;
 }
 answered=!!me?.answered;deadline=d.game.startedAt+d.game.timeLimit*1000;$("question").textContent=d.game.question.q;$("state").textContent=answered?'JAVOB QABUL QILINDI':'JAVOBNI TANLANG';
 $("options").innerHTML=d.game.question.options.map((x,i)=>`<button class="option" ${answered?'disabled':''} onclick="answer(${i})"><b>${String.fromCharCode(65+i)}</b>) ${esc(x)}</button>`).join('');tick();
}
function tick(){
 if(tickTimer)clearTimeout(tickTimer);
 const s=Math.max(0,Math.ceil((deadline-Date.now())/1000));$("timer").textContent=s+' s';
 if(s<=5&&s>0&&!answered&&s!==lastTick){sound('tick');lastTick=s;}
 if(s>0&&!answered)tickTimer=setTimeout(tick,250);
}
function answer(i){if(answered)return;answered=true;sound('ok');if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'answer',answer:i}));$('feedback').innerHTML='<div class="msg pulse">⚡ Javob qabul qilindi! Tezlik bonusi hisoblanmoqda...</div>';$('playcard').classList.add('flash');setTimeout(()=>$('playcard').classList.remove('flash'),600);document.querySelectorAll('.option').forEach(b=>b.disabled=true);burst()}
function showCountdown(){const c=$('countdown');let n=3;c.textContent=n;c.classList.add('show');const t=setInterval(()=>{n--;if(n>0){c.textContent=n;sound('tick')}else{clearInterval(t);c.classList.remove('show')}} ,700)}
function burst(){const p=$('particles');['⚛️','⚡','🧪','✨','🏁'].forEach((x,i)=>{const e=document.createElement('span');e.className='particle';e.textContent=x;e.style.left=(40+Math.random()*20)+'%';e.style.top=(42+Math.random()*15)+'%';e.style.setProperty('--dx',((Math.random()-.5)*260)+'px');e.style.setProperty('--dy',(-80-Math.random()*180)+'px');p.appendChild(e);setTimeout(()=>e.remove(),950)})}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
